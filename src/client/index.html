<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>π - PI WEB</title>
    <meta name="theme-color" content="#0d1117" />
    <!-- Keep the legacy Apple metadata: Safari uses it for Add to Home Screen on
         versions that do not yet apply the equivalent web-manifest fields. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PI WEB" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <style>
      :root {
        color-scheme: dark light;
        /*
         * Scale tokens: the parts of the look that do not change with the
         * palette. Themes decide colour; these decide density, rhythm and
         * shape, so two themes cannot disagree about how tall a row is or how
         * round a card corner should be. Custom properties inherit through
         * shadow roots, which is what lets every component read them.
         *
         * Spacing is a 2px-based scale with the small steps a dense tool
         * actually uses; type is a compact scale for glancing rather than
         * reading; radii step with the size of the thing they round.
         */
        --pi-space-1: 2px;
        --pi-space-2: 4px;
        --pi-space-3: 6px;
        --pi-space-4: 8px;
        --pi-space-5: 10px;
        --pi-space-6: 12px;
        --pi-space-7: 16px;
        --pi-space-8: 20px;
        --pi-space-9: 24px;
        --pi-text-2xs: 11px;
        --pi-text-xs: 12px;
        --pi-text-sm: 13px;
        --pi-text-base: 14px;
        --pi-text-md: 15px;
        --pi-text-lg: 17px;
        --pi-text-xl: 20px;
        --pi-leading-tight: 1.25;
        --pi-leading-normal: 1.45;
        --pi-weight-regular: 400;
        --pi-weight-medium: 500;
        --pi-weight-semibold: 600;
        /* The emphatic step the filled controls and unread names already used as
           a bare 650; named so the ramp has no gap between 600 and bold. */
        --pi-weight-strong: 650;
        --pi-weight-bold: 700;
        --pi-radius-xs: 0px;
        --pi-radius-sm: 1px;
        --pi-radius-md: 2px;
        --pi-radius-lg: 3px;
      /* Inside a 1px-bordered card the corner is one pixel tighter; a child
         pulled flush with the padding edge must round by this, not by
         --pi-radius-lg, or a sliver of the card shows at each corner. */
        --pi-radius-xl: 4px;
        --pi-radius-pill: 999px;

        /* Layers, in the order they interrupt: what is written on a surface,
           what floats above it, what covers it, and what demands an answer
           before anything else. */
        --pi-layer-raised: 10;
        --pi-layer-sticky: 20;
        --pi-layer-popover: 30;
        --pi-layer-overlay: 40;
        --pi-layer-dialog: 50;
        --pi-layer-blocking: 60;
        /* One height for every panel header, so the left rail and the chat
           drawer share a horizontal rule instead of each picking its own. */
        /* The conversation column: the transcript, the composer and the
           status dock all measure from these, so they share one left edge at
           every window size. */
        --pi-chat-measure: 100%;
        --pi-chat-gutter: var(--pi-space-7);
        /* Where stacked chrome rows start their text. One value, so the bar, the
           compact header and the conversation below them share a reading edge. */
        /* The distance from the screen edge to text a person reads in lists,
           sheets and panels. One value per breakpoint, so five lists cannot
           carry five private answers to the same question. */
        --pi-reading-edge: var(--pi-space-7);
        /* The state rail's width; named because two vocabularies of rows wear
           it and the fallback literal had drifted out of the declared set. */
        --pi-rail-width: 3px;
        /* A list row that carries a title and a second line. One value, so four
           lists cannot drift to 52, 56, 58 and 60 for the same shape. */
        --pi-row-min-height: 56px;
        /* The info mark, drawn: a character took whatever font resolved it and its
           ink ran a third larger than the icons beside it. */
        --pi-info-mask: url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27black%27 stroke-width=%272%27 stroke-linecap=%27round%27%3E%3Ccircle cx=%2712%27 cy=%2712%27 r=%279%27/%3E%3Cpath d=%27M12 11v5%27/%3E%3Cpath d=%27M12 8h.01%27/%3E%3C/svg%3E");
        /* The bar template (owner's ruling: an SPA's bars, all one height):
           every header, footer and toolbar is one bar tall, its controls one
           control tall and vertically centred, and the first and last control
           sit one inset from the edge - about a quarter of a control - so
           nothing touches the boundary. */
        --pi-panel-header-height: 44px;
        --pi-panel-header-control-height: 36px;
        --pi-bar-inset: var(--pi-space-4);
        /* Touch floor first: a control is 44px on a finger, 32px under a mouse.
           The comfort step between them is what search fields, model chips and
           menu rows want; leaving it unnamed is how 30, 34, 36, 38 and 40 all
           shipped as the same intention. */
        --pi-control-height: 32px;
        --pi-control-height-comfort: 36px;
        --pi-control-height-touch: 44px;
        /* State marks: one motif at three sizes. A dot means "this is working"
           or "this is its state" everywhere it appears, and it shipped at 4, 5,
           6, 7 and 8px on one screen before the scale was named. */
        /* A tick box is a control the finger aims at, not a glyph: one size,
           everywhere, so two settings panels cannot ship two of them. */
        --pi-checkbox-size: 24px;
        /* One meaning, one value: a control that cannot be used right now.
           It had been spelled .5, .52 and .55 - twice inside one shadow root. */
        --pi-disabled-opacity: .55;
        --pi-dot-xs: 4px;
        --pi-dot-sm: 6px;
        --pi-dot-md: 8px;
        --pi-motion-fast: 120ms;
        --pi-motion-base: 180ms;
        --pi-motion-slow: 260ms;
        --pi-ease: cubic-bezier(0.2, 0, 0, 1);
        --pi-focus-ring-width: 2px;
        --pi-focus-ring-offset: 2px;
        /* Inside a scrolling or clipped box the ring is drawn inward instead;
           43 rules were spelling both offsets by hand. */
        --pi-focus-ring-offset-inset: -2px;
        --pi-focus-ring-offset-tight: 1px;
        /*
         * Type stacks, named by role. Nothing is downloaded: this app is a PWA
         * that has to work offline and on a LAN address, so the identity comes
         * from the pairing and the scale rather than from a webfont. A theme or
         * a plugin can override any of these.
         *
         * UI prefers the platform's own interface face (SF, Segoe, Roboto);
         * display reaches for a more characterful grotesque when the system has
         * one and falls back to the UI stack. Since the pro redesign the UI
         * face IS the mono stack; the separate terminal token stays so themes
         * can split them again.
         */
        --pi-font-ui: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        --pi-font-display: var(--pi-font-ui);
        --pi-font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        --pi-control-font-size: 16px;
        --pi-control-font-family: var(--pi-font-ui);
        --pi-control-monospace-font-family: var(--pi-font-mono);
        /* Graphite + amber (owner's pick): a neutral, slightly warm graphite
           with one amber accent, replacing the stock blue-on-black. The same
           hue ships a light side under the media query below, so the core
           theme answers the system light/dark preference without a plugin. */
        --pi-bg: #131519;
        --pi-surface: #1a1d23;
        --pi-surface-hover: #23272f;
        --pi-terminal-bg: #0e1013;
        --pi-terminal-text: #dfe3ea;
        --pi-border: #383e48;
        --pi-border-muted: #262b33;
        --pi-text: #d5dae2;
        --pi-text-secondary: #a7aeb9;
        --pi-text-bright: #eef1f5;
        --pi-muted: #8b929d;
        --pi-dim: #6b7280;
        --pi-accent: #d9a24a;
        /* The label on an accent fill; a theme that omits it falls back to the
           background colour, which is what shipped a 3.74:1 primary button. */
        --pi-on-accent: #201a0c;
        --pi-accent-border: #8a6a2a;
        --pi-selection-bg: #332c1a;
        --pi-success: #56b463;
        --pi-success-border: #2f6e3c;
        --pi-success-bg: #12211a;
        --pi-success-surface: #142a1d;
        --pi-success-ring: #56b46355;
        --pi-warning: #d7b256;
        --pi-warning-border: #6e5a1a;
        --pi-warning-surface: #242110;
        --pi-danger: #e5695f;
        --pi-purple: #c7a5f5;
        --pi-purple-border: #9a6ff0;
        --pi-purple-surface: #221636;
        --pi-overlay: #000c;
        --pi-shadow-soft: #0000;
        --pi-shadow: #0000;
        --pi-shadow-strong: #0000;
        --pi-bg-overlay-soft: #131519dd;
        --pi-bg-overlay: #131519e6;
        --pi-success-bg-overlay: #12211aee;
        --pi-terminal-selection: #4a3d1e;

        /* Semantic surface ladder: canvas < panel < card < raised. Themes set
           the stops explicitly; these fallbacks derive them from the legacy
           trio, so a theme that ships without the ladder still lands on a
           coherent one. color-mix keeps the step direction correct for both
           dark and light palettes. */
        --pi-surface-canvas: var(--pi-bg);
        --pi-surface-panel: var(--pi-surface);
        --pi-surface-card: color-mix(in srgb, var(--pi-surface) 92%, var(--pi-text));
        --pi-surface-raised: color-mix(in srgb, var(--pi-surface) 84%, var(--pi-text));
        --pi-surface-active: color-mix(in srgb, var(--pi-surface-hover) 82%, var(--pi-text));

        /* The light side of the same hue, following the system preference.
           applyNativeProTheme() clears every inline override, so this media
           block governs whenever no plugin theme is active. */

        /* Elevation composes full box-shadows from the theme's shadow colors,
           so a layer never invents its own blur and spread again. */
        --pi-elevation-1: 0 1px 2px var(--pi-shadow-soft);
        --pi-elevation-2: 0 2px 10px var(--pi-shadow);
        --pi-elevation-3: 0 12px 40px var(--pi-shadow-strong);
      }

      /* A phone has no width to spare: 32px of a 393px screen went to margins.
         The conversation and the composer share this gutter, so narrowing it
         widens both together and keeps them lined up. */
      @media (max-width: 640px) {
  
      /* Compact tier (owner: content first): rows sit on the 44px touch
           floor instead of 56px, and message/section rhythm drops one token
           each - through tokens only, so every surface tightens together. */
        :root {
          /* One column for every edge-anchored surface. The transcript used a
             tighter gutter than the bars and the composer, so cards started
             two pixels outside the box the reader types in. */
          --pi-chat-gutter: var(--pi-bar-inset);
          --pi-reading-edge: var(--pi-space-4);
          --pi-row-min-height: 44px;
          /* Type drops one step too: the owner read the phone sizes as
             "elderly-phone" large. 12px meta floor holds. */
          --pi-text-sm: 12px;
          --pi-text-base: 13px;
          --pi-text-md: 14px;
          --pi-text-lg: 15px;
          --pi-text-xl: 17px;
          --pi-panel-header-height: 44px;
          --pi-panel-header-control-height: 36px;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --pi-bg: #f6f5f2;
          --pi-surface: #ffffff;
          --pi-surface-hover: #eceae4;
          --pi-terminal-bg: #14161a;
          --pi-terminal-text: #e2e5ea;
          --pi-border: #c6c1b6;
          --pi-border-muted: #ddd9d0;
          --pi-text: #33373d;
          --pi-text-secondary: #5c626b;
          --pi-text-bright: #1b1e23;
          --pi-muted: #6f757e;
          --pi-dim: #8f959d;
          --pi-accent: #8a6510;
          --pi-on-accent: #ffffff;
          --pi-accent-border: #b07f1c;
          --pi-selection-bg: #f2e7cd;
          --pi-success: #1f7a33;
          --pi-success-border: #2f8f45;
          --pi-success-bg: #e9f4ea;
          --pi-success-surface: #ddefe0;
          --pi-success-ring: #1f7a3355;
          --pi-warning: #8a6d10;
          --pi-warning-border: #a3851a;
          --pi-warning-surface: #f7f0da;
          --pi-danger: #c93c31;
          --pi-purple: #6d4fc4;
          --pi-purple-border: #7d5ed6;
          --pi-purple-surface: #efeafb;
          --pi-overlay: #14161acc;
          --pi-bg-overlay-soft: #f6f5f2dd;
          --pi-bg-overlay: #f6f5f2e6;
          --pi-success-bg-overlay: #e9f4eaee;
          --pi-terminal-selection: #3a404b;
          --pi-shadow-soft: #0000;
          --pi-shadow: #0000;
          --pi-shadow-strong: #0000;
        }
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--pi-bg); color: var(--pi-text); }
      body { min-height: 100dvh; }
      /* Pinching moves the visual viewport under the layout viewport, which is
         the signal a soft keyboard gives, so the shell shortens for a keyboard
         that is not there. Scale belongs to the app's own control. */
      html { touch-action: pan-x pan-y; }
      /* Inherited, so this one rule crosses every shadow root - the same
         channel the design tokens ride. The per-component sweep missed real
         buttons twice; the root rule cannot miss. */
      html { -webkit-tap-highlight-color: transparent; }
      /* Leading is stated, not left to the font's "normal": the mono face's
         normal sits a step taller than the sans one the row rhythm was tuned
         against, and mixed normal/1 boxes inside centered rows are what made
         the pro switch read misaligned. Tight is the TUI rhythm. */
      body { line-height: var(--pi-leading-tight); }
    </style>
  </head>
  <body>
    <pi-web-app></pi-web-app>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
