name: Release plugin API (tag push)

on:
  push:
    tags: ["plugin-api-v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: npm publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Build
        run: |
          npm run build
          npm run build:plugin-api-package

      # The version lives in package.json and nothing else aligns it: a tag
      # pushed against the wrong commit would otherwise release under the
      # tag's name whatever version the tree happens to carry.
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ver="plugin-api-v$(node -p "require('./packages/pi-web-plugin-api/package.json').version")"
          if [ "$ver" != "${{ github.ref_name }}" ]; then
            echo "tag ${{ github.ref_name }} does not match package version tag $ver"
            exit 1
          fi

      - name: Pack
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: packages/pi-web-plugin-api
        run: |
          rm -rf pack-out && mkdir pack-out
          npm pack --silent --pack-destination pack-out >/dev/null

      # The first release of a package cannot use trusted publishing; with
      # NPM_TOKEN present this bootstraps with the token, and once the trusted
      # publisher is configured on npm the OIDC route takes over on its own.
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: packages/pi-web-plugin-api
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pkg="$(node -p "require('./package.json').name")"
          ver="$(node -p "require('./package.json').version")"
          if npm view "$pkg@$ver" version >/dev/null 2>&1; then
            echo "$pkg@$ver is already on npm; skipping publish (rerun of a released tag)"
          elif [ -n "$NPM_TOKEN" ]; then
            echo "publishing $pkg@$ver with the bootstrap token (no provenance)"
            npm publish "./pack-out/"*.tgz --access public --tag alpha
          else
            npm publish "./pack-out/"*.tgz --access public --provenance --tag alpha
          fi

      # The release is created only after publish succeeded, so a release page
      # never advertises a tarball the registry does not have. Rerunning a
      # partially released tag re-updates the release instead of duplicating it.
      - name: Attach tarball to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/pi-web-plugin-api/pack-out/*.tgz
          generate_release_notes: true
