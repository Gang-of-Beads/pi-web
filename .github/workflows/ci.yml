name: CI

# Pull requests validate feature branches on Linux; main is validated again
# after every merge. Windows compatibility is checked only by the release
# workflow, where it gates publication. Tag pushes are covered by publish.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: ${{ matrix.lane }} (Linux)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [tests, checks-and-package]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        if: matrix.lane == 'tests'
        run: pnpm test

      - name: Static checks
        if: matrix.lane == 'checks-and-package'
        run: pnpm run verify:static

      - name: Build
        if: matrix.lane == 'checks-and-package'
        run: pnpm run build

      - name: Smoke test npm global package install
        if: matrix.lane == 'checks-and-package'
        run: pnpm run smoke:package-install
