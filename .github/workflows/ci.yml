name: CI

# Tests run locally before a change is merged to main, and in CI only on a
# release tag (publish.yml runs the full verify on Linux and Windows before
# publishing; owner, 2026-10-03). Neither a merge to main nor a pull request
# runs this workflow; it stays available to run by hand.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: ${{ matrix.lane }} (Linux)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [tests, checks-and-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        if: matrix.lane == 'tests'
        run: pnpm test

      - name: Static checks
        if: matrix.lane == 'checks-and-build'
        run: pnpm run verify:static

      - name: Build
        if: matrix.lane == 'checks-and-build'
        run: pnpm run build
