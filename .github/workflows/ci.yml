name: CI

# Every pull request and every push to main runs the full verify (typecheck,
# lint, Knip and the Vitest suite) and the production build on each Node line the package supports:
# 22 is the `engines` floor's major, 24 is what the release jobs use. Windows runs the same on Node
# 24, as the release's Windows check does, so a Windows-only failure shows on the push that caused
# it rather than at the release tag.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22, label: "Node 22" }
          - { os: ubuntu-latest, node: 24, label: "Node 24" }
          - { os: windows-latest, node: 24, label: "Windows, Node 24" }
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm run verify

      - name: Build
        run: pnpm run build
