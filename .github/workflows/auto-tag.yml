# Auto-tag every push to main so the release pipeline always has a fresh,
# pre-built artifact (see release-tarball.yml which attaches the packed
# tarball to each v* tag). Without this, releases were never created and the
# "use without building" promise was unfulfilled.
name: Auto-tag main

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  tag:
    name: Tag shorthand + date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse --short HEAD)"
          tag="v$(date +%Y%m%d)-${sha}"
          if git tag -l "$tag" | grep -q .; then
            echo "tag $tag already exists; nothing to do"
          else
            git tag "$tag" HEAD
            git push origin "$tag"
            echo "created $tag"
          fi