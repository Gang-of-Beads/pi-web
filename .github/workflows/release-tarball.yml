# Attach an installable build to every release, so a fork can be used without
# building from source.
#
# The upstream publish workflow pushes to npm under a scope this fork cannot
# publish to. A packed tarball needs no registry account and no npm scope: it is
# the same artefact `npm publish` would upload, so `npm i -g <url>` installs a
# fork exactly like the published package, `dist` included.
name: Attach release tarball

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tarball:
    name: Build and attach
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The gates that decide whether this build is fit to hand to anyone. A
      # release that fails them is worse than no release, because it looks
      # official.
      - name: Verify
        run: npm run verify

      # `npm pack` runs prepack, which builds; packing rather than zipping dist
      # keeps the artefact identical in shape to the published package.
      #
      # The filename comes from the pack directory, not from stdout. `--silent`
      # suppresses npm's own output but not the lifecycle script's, so prepack's
      # build log lands on stdout too, and every release since this step was
      # written failed with "Unable to process file command 'output'" on
      # `Invalid format 'vite v8.1.4 building client environment...'`. Globbing
      # a directory that holds exactly one tarball cannot be polluted by
      # anything a build decides to print.
      - name: Pack
        run: |
          rm -rf pack-out && mkdir pack-out
          npm pack --silent --pack-destination pack-out

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: pack-out/*.tgz
          # A tag push with no release yet gets one, so pushing a tag is the
          # whole ritual.
          generate_release_notes: true
          body: |
            Install this build without cloning or building:

            ```
            npm i -g https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.pack.outputs.tarball }}
            ```

            Then run `pi-web` as usual. The tarball is the same artefact `npm publish` would upload, `dist` included.
