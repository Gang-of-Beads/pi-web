name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Trusted publishing (OIDC): npm accepts publishes from this workflow via the
# trust relationship configured with `npm trust github` on @vincenthanxiaodu/pi-web.
# No NPM_TOKEN secret is used; npm CLI exchanges the GitHub Actions OIDC token
# for a short-lived publish credential and provenance is attached automatically.

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Build
        run: npm run build

      - name: Smoke test npm 12 global package install
        run: npm run smoke:package-install

      # With trusted publishing the OIDC token is detected automatically;
      # provenance is generated automatically for public repos/packages.
      - name: Publish
        run: npm publish --access public --provenance

  deploy-docs:
    name: Deploy stable docs to pi-web.dev
    # Stable docs only move on GitHub Releases; the dev variant at pi-web.dev/dev/
    # deploys from main via docs-dev.yml. Skipped on manual workflow_dispatch runs.
    # The fork does not own pi-web.dev credentials, so this job is skipped here
    # rather than left to fail: every release since 1.202608.4 reported a red
    # workflow whose only failure was a docs site this repository does not
    # publish, which trains everyone to ignore release failures. Upstream keeps
    # the job because upstream has the token.
    if: github.event_name == 'release' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    needs: publish
    runs-on: ubuntu-latest
    steps:
      # Release events check out the published tag, so docs match the npm release.
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy stable docs worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Keep in sync with docs-dev.yml so both sites deploy with the same wrangler.
          wranglerVersion: "4.119.0"
          command: deploy --config docs/wrangler.jsonc
