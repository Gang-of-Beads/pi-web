# Tag-driven release: pushing a v* tag is the whole ritual. One workflow does
# all of it on purpose, in order: verify, build, smoke-test, attach an
# installable tarball to a GitHub Release, publish the SAME tarball to npm,
# and deploy stable docs when this repository owns the credentials.
#
# Merging to main never releases anything; ci.yml gates every branch instead.
# The npm trusted-publisher relationship is bound to this workflow's path
# (.github/workflows/publish.yml), so keep the filename stable across edits.
name: Release (tag push)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

# Trusted publishing (OIDC): npm accepts publishes from this workflow via the
# trust relationship configured with `npm trust github` on @vincenthanxiaodu/pi-web.
# No NPM_TOKEN secret is used; npm CLI exchanges the GitHub Actions OIDC token
# for a short-lived publish credential and provenance is attached automatically.

jobs:
  release:
    name: GitHub Release + npm publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The gates that decide whether this build is fit to hand to anyone. A
      # release that fails them is worse than no release, because it looks
      # official.
      - name: Verify
        run: npm run verify

      - name: Build
        run: npm run build

      - name: Smoke test npm 12 global package install
        run: npm run smoke:package-install

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v20

      # `flake check --no-build` only evaluates the derivation. Build the actual
      # package before attaching a release or publishing it to npm so the Nix
      # package's fixed-output npmDepsHash is verified at release time.
      - name: Build Nix package
        run: nix build .#pi-web --no-link

      # Release steps only make sense on a tag ref. workflow_dispatch exists to
      # re-run a botched tag release; dispatching on a branch still runs the
      # checks above and stops here.
      - name: Pack
        id: pack
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # `npm pack` runs prepack, which builds; packing rather than zipping
          # dist keeps the artefact identical in shape to the published package.
          #
          # The filename comes from the pack directory, not from stdout.
          # --silent suppresses npm's own output but not the lifecycle script's.
          # Take the filename from the directory after packing so a build log
          # never reaches GITHUB_OUTPUT and invalidates its command format.
          rm -rf pack-out && mkdir pack-out
          npm pack --silent --pack-destination pack-out >/dev/null
          tarball="$(find pack-out -maxdepth 1 -type f -name '*.tgz' -printf '%f\n')"
          test "$(printf '%s\n' "$tarball" | wc -l)" -eq 1
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Attach tarball to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pack-out/*.tgz
          generate_release_notes: true
          body: |
            Install this build without cloning or building:

            ```
            npm i -g https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.pack.outputs.tarball }}
            ```

            Then run `pi-web` as usual. The tarball is the exact artefact published to npm for this tag, `dist` included.

      # Publish the exact tarball attached to the GitHub Release, so the
      # registry artifact and the release artifact cannot drift. Skipped when
      # the version is already on npm, which makes reruns of a partially
      # released tag idempotent instead of a guaranteed red step.
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pkg="$(node -p "require('./package.json').name")"
          ver="$(node -p "require('./package.json').version")"
          if npm view "$pkg@$ver" version >/dev/null 2>&1; then
            echo "$pkg@$ver is already on npm; skipping publish (rerun of a released tag)"
          else
            npm publish "./pack-out/${{ steps.pack.outputs.tarball }}" --access public --provenance
          fi

  deploy-docs:
    name: Deploy stable docs to pi-web.dev
    # Stable docs only move on real tag releases; skipped on manual
    # workflow_dispatch runs and in repositories without the credentials. A red
    # docs job whose only failure is a site this repository does not publish
    # trains everyone to ignore release failures.
    if: github.event_name == 'push' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    needs: release
    runs-on: ubuntu-latest
    steps:
      # Tag push events check out the published tag, so docs match the npm release.
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy stable docs worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Keep in sync with docs-dev.yml so both sites deploy with the same wrangler.
          wranglerVersion: "4.119.0"
          command: deploy --config docs/wrangler.jsonc
